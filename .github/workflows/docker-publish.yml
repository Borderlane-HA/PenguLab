name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build (branch or tag)
        required: true
        default: main
        type: string
      image_tag:
        description: Exact Docker tag to publish
        required: true
        default: dev
        type: string
      channel:
        description: Moving channel tag
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
          - prerelease

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: borderlane-ha/pengulab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            ref="$RELEASE_TAG"
          else
            ref="$MANUAL_SOURCE_REF"
          fi
          [[ -n "$ref" ]] || { echo "Source ref is empty" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve Docker tags
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          REGISTRY_NAME: ${{ env.REGISTRY }}
          IMAGE_NAME_VALUE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            version="$RELEASE_TAG"
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              channel="prerelease"
            else
              channel="stable"
            fi
          else
            version="$MANUAL_IMAGE_TAG"
            channel="$MANUAL_CHANNEL"
          fi

          [[ "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Invalid Docker tag: $version" >&2
            exit 1
          }

          image="$REGISTRY_NAME/$IMAGE_NAME_VALUE"
          tags=("$image:$version")

          case "$channel" in
            stable)
              tags+=("$image:latest")
              ;;
            prerelease)
              tags+=("$image:prerelease")
              ;;
            dev)
              ;;
            *)
              echo "Unknown channel: $channel" >&2
              exit 1
              ;;
          esac

          revision="$(git rev-parse HEAD)"
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "revision=$revision"
            echo "tags<<TAGS"
            printf '%s\n' "${tags[@]}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $version to channel: $channel"
          printf '  %s\n' "${tags[@]}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
